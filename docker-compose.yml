services:
  api:
    build: .
    ports: ["8000:8000"]
    env_file:
      - path: .env
        required: false
    environment:
      # Ollama runs on the host machine (see README "Connecting to Ollama")
      OLLAMA_HOST: ${OLLAMA_HOST_DOCKER:-http://host.docker.internal:11434}
    volumes:
      - ./data:/app/data          # documents, SQLite (data/structured), OCR cache - persist across restarts
      - ./chroma_db:/app/chroma_db  # ChromaDB PersistentClient (vector store) - never re-ingested on restart
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      start_period: 60s
  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    ports: ["8501:8501"]
    environment:
      API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
